<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrellat</title>
    <link rel="stylesheet" href="../shared/fonts/phosphor/phosphor.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <script type="importmap">
    {
        "imports": {
            "three": "./libs/three.js"
        }
    }
    </script>
</head>
<body>

    <div id="header">
        <a href="../" id="app-title" style="text-decoration:none;color:inherit">ENTRELLAT <span id="app-version" class="version-text"></span></a>
        <div id="score-board"><span id="score">0</span></div>
        <div class="header-actions">
            <button id="stats-btn" class="icon-btn" aria-label="Stats"><i class="ph-light ph-chart-bar"></i></button>
            <button id="info-btn" class="icon-btn" aria-label="How to play">?</button>
        </div>
    </div>

    <div id="game-container">
        <div id="webgl-canvas"></div>
        <div id="overlay">MATCH</div>
    </div>

    <div id="ui-container">
        <div class="option-card" data-index="0"><canvas width="200" height="200"></canvas></div>
        <div class="option-card" data-index="1"><canvas width="200" height="200"></canvas></div>
        <div class="option-card" data-index="2"><canvas width="200" height="200"></canvas></div>
        <div class="option-card" data-index="3"><canvas width="200" height="200"></canvas></div>
    </div>

    <div id="intro" class="intro-overlay visible">
        <div class="intro-content">
            <img src="icon.png" alt="Entrellat" class="intro-icon">
            <h1 class="intro-title">ENTRELLAT <span id="app-version-intro" class="version-text"></span></h1>
            <p class="intro-tagline">3D face matching</p>
            <ul class="intro-rules">
                <li>A cube with maze patterns rotates in 3D</li>
                <li>Four panels show possible face views</li>
                <li>Pick the one matching a face on the cube</li>
                <li>Drag the cube to inspect it from any angle</li>
            </ul>
            <button id="play-btn" class="intro-play-btn">Play</button>
            <a href="../" class="intro-hub-link">← Back to hub</a>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="modal-overlay hidden">
        <div class="modal-content modal-history-content">
            <h2>History</h2>
            <div id="history-list" class="history-list-inner"></div>
            <button id="close-history-btn" class="modal-btn">Close</button>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
