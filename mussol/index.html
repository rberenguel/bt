<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Mussol</title>
    <link rel="stylesheet" href="../shared/fonts/inter.css" />
    <link rel="stylesheet" href="../shared/fonts/phosphor/phosphor.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <div class="app-container">
      <div class="header-stats">
        <div
          class="stat-label"
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-right: 0.5rem;
            width: 100%;
          "
        >
          <a href="../" style="text-decoration: none; color: inherit"
            >Mussol <span id="app-version" class="version-text"></span
          ></a>
          <button
            id="stats-btn"
            aria-label="Stats"
            style="
              background: none;
              border: none;
              padding: 0;
              cursor: pointer;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <div class="brain-container" id="battery-icon">
              <div class="brain-base">&#xe74e;</div>
              <div class="brain-progress-fill">&#xe74e;</div>
              <div class="brain-fire-fill">&#xe74e;</div>
              <canvas id="fire-canvas"></canvas>
            </div>
          </button>
        </div>
      </div>

      <div class="progress-container">
        <div id="timer-bar" class="progress-bar" style="width: 100%"></div>
      </div>

      <div id="question-counter" class="question-counter"></div>

      <div id="loader" class="loader-text">Loading questions…</div>

      <div id="question-area" style="display: none">
        <div id="question-stem"></div>
        <div id="choices-container"></div>
      </div>
    </div>

    <!-- Results modal -->
    <div id="results-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <h2>Session Complete</h2>
        <div class="modal-stats">
          <div class="modal-stat">
            <span class="label">Correct:</span>
            <span
              ><span id="modal-correct">0</span> /
              <span id="modal-total">0</span></span
            >
          </div>
          <div class="modal-stat">
            <span class="label">Incorrect:</span>
            <span id="modal-incorrect">0</span>
          </div>
          <div class="modal-stat">
            <span class="label">Accuracy:</span>
            <span><span id="modal-acc">0</span>%</span>
          </div>
        </div>
        <button id="modal-close-btn" class="modal-btn">Play again</button>
      </div>
    </div>

    <!-- History modal -->
    <div id="history-modal" class="modal-overlay hidden">
      <div
        class="modal-content"
        style="
          padding: 1rem 0;
          height: 90vh;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          width: 95%;
          max-width: 24rem;
        "
      >
        <h2 style="margin: 0 1rem 0.5rem 1rem">History</h2>
        <div
          id="history-list"
          style="flex: 1 1 auto; overflow-y: auto; padding: 0 1rem"
        ></div>
        <div style="padding: 0 1rem; margin-top: 1rem">
          <button id="close-history-btn" class="modal-btn">Close</button>
        </div>
      </div>
    </div>

    <!-- Intro overlay -->
    <div id="intro" class="intro-overlay">
      <div class="intro-content">
        <img src="icon.png" alt="Mussol" class="intro-icon" />
        <h1 class="intro-title">
          <a href="../" style="text-decoration: none; color: inherit">Mussol</a>
          <span id="app-version-intro" class="version-text"></span>
        </h1>
        <p class="intro-tagline">Analogy reasoning</p>
        <ul class="intro-rules">
          <li>Read the stem pair and find its relationship</li>
          <li>Pick the answer pair that shares the same relationship</li>
          <li>10 questions · 30 seconds each · no answer reveals</li>
        </ul>
        <button id="play-btn" class="intro-play-btn">Play</button>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
