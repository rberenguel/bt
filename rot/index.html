<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Rot</title>
    <link rel="stylesheet" href="../shared/fonts/phosphor/phosphor.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="icon.png" type="image/png" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <div class="app-container">
      <div class="header">
        <a
          href="../"
          class="app-name"
          style="text-decoration: none; color: inherit"
        >
          Rot <span id="app-version" class="version-text"></span>
        </a>
        <button id="stats-btn" class="stats-btn" aria-label="Stats">
          <div class="brain-container" id="battery-icon">
            <div class="brain-base">&#xe74e;</div>
            <div class="brain-progress-fill">&#xe74e;</div>
            <div class="brain-fire-fill">&#xe74e;</div>
            <canvas id="fire-canvas"></canvas>
          </div>
        </button>
      </div>

      <div class="top-row">
        <span id="score-display" class="score-display"></span>
      </div>
      <div class="timer-bar-track">
        <div id="timer-bar" class="timer-bar"></div>
      </div>

      <div id="display-area" class="display-area">
        <div id="idle-overlay" class="idle-overlay">
          <p>Find the two identical shapes.</p>
          <p class="sub">They may be rotated differently.</p>
        </div>
        <div id="shape-grid" class="shape-grid"></div>
      </div>

      <div class="controls-row">
        <button id="play-btn" class="control-btn play-btn">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </button>
      </div>
    </div>

    <!-- Results Modal -->
    <div id="results-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <h2>Done</h2>
        <div class="modal-stats">
          <div class="modal-stat">
            <span class="label">Score</span>
            <span id="modal-score">—</span>
          </div>
          <div class="modal-stat">
            <span class="label">Accuracy</span>
            <span id="modal-accuracy">—</span>
          </div>
          <div class="modal-stat">
            <span class="label">Duration</span>
            <span id="modal-avgtime">2:00</span>
          </div>
        </div>
        <button id="modal-close-btn" class="modal-btn">Play again</button>
        <a href="../" class="modal-hub-link">← Back to hub</a>
      </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="modal-overlay hidden">
      <div
        class="modal-content"
        style="
          padding: 1rem 0;
          height: 90vh;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          width: 95%;
          max-width: 24rem;
        "
      >
        <h2 style="margin: 0 1rem 0.5rem 1rem">History</h2>
        <div
          id="history-list"
          style="
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 0 1rem;
            position: relative;
          "
        ></div>
        <div style="padding: 0 1rem; margin-top: 1rem">
          <button id="close-history-btn" class="modal-btn">Close</button>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
