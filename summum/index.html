<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Summum</title>
    <link rel="stylesheet" href="../shared/fonts/inter.css" />
    <link rel="stylesheet" href="../shared/fonts/phosphor/phosphor.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="icon.png" type="image/png" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <div class="app-container">
      <div class="header-stats">
        <div
          class="stat-label"
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-right: 0.5rem;
            width: 100%;
          "
        >
          <a href="../" style="text-decoration: none; color: inherit"
            >Summum <span id="app-version" class="version-text"></span
          ></a>
          <button
            id="stats-btn"
            aria-label="Stats"
            style="
              background: none;
              border: none;
              padding: 0;
              cursor: pointer;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <div class="brain-container" id="battery-icon">
              <div class="brain-base">&#xe74e;</div>
              <div class="brain-progress-fill">&#xe74e;</div>
              <div class="brain-fire-fill">&#xe74e;</div>
              <canvas id="fire-canvas"></canvas>
            </div>
          </button>
        </div>
      </div>

      <div class="progress-container">
        <div id="progress-bar" class="progress-bar" style="width: 100%"></div>
      </div>

      <div id="display-area" class="display-area border-normal">
        <div id="idle-text" class="idle-text">
          <p>Sum current digit with the previous.</p>
          <p class="sub">2 correct = faster. 1 miss = slower. 50 rounds.</p>
        </div>
        <div id="digit" class="digit-text hidden">?</div>
      </div>

      <div id="numpad" class="numpad"></div>

      <div id="status-text" class="status-text"></div>
    </div>

    <div id="results-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <h2>Session Complete</h2>
        <div class="modal-stats">
          <div class="modal-stat">
            <span class="label">Correct:</span>
            <span
              ><span id="modal-correct">0</span> /
              <span id="modal-total">0</span></span
            >
          </div>
          <div class="modal-stat">
            <span class="label">Accuracy:</span>
            <span><span id="modal-acc">0</span>%</span>
          </div>
          <div class="modal-stat">
            <span class="label">Best Pace:</span>
            <span><span id="modal-best">0</span>s</span>
          </div>
        </div>
        <button id="modal-close-btn" class="modal-btn">Play again</button>
        <a href="../" class="modal-hub-link">← Back to hub</a>
      </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="modal-overlay hidden">
      <div
        class="modal-content"
        style="
          padding: 1rem 0;
          height: 90vh;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          width: 95%;
          max-width: 24rem;
        "
      >
        <h2 style="margin: 0 1rem 0.5rem 1rem">History</h2>
        <div
          id="history-list"
          style="flex: 1 1 auto; overflow-y: auto; padding: 0 1rem"
        >
          <!-- Calendar grid will be generated here -->
        </div>
        <div style="padding: 0 1rem; margin-top: 1rem">
          <button id="close-history-btn" class="modal-btn">Close</button>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
