<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon candidates for Tanmateix</title>
  <link rel="stylesheet" href="fonts/phosphor/phosphor.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      padding: 24px;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 6px;
      color: #38bdf8;
    }

    p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:hover { background: #334155; }
    button.primary { background: #38bdf8; color: #000; border-color: #38bdf8; }
    button.primary:hover { background: #22d3ee; }

    #output {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #7dd3fc;
      white-space: pre-wrap;
      margin-bottom: 20px;
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
    }

    .icon-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 14px 8px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .icon-card:hover {
      border-color: #38bdf8;
      background: #1a2a3f;
    }

    .icon-card.removed {
      opacity: 0.25;
      border-color: #ef4444;
      background: #1a0f0f;
    }

    .icon-card i {
      font-size: 2rem;
      color: #e2e8f0;
      line-height: 1;
    }

    .icon-card.removed i {
      color: #ef4444;
    }

    .icon-card .name {
      font-size: 0.68rem;
      color: #94a3b8;
      text-align: center;
      line-height: 1.3;
      word-break: break-word;
    }

    .icon-card.removed .name {
      color: #ef4444;
      text-decoration: line-through;
    }

    .count {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <h1>Icon candidates for Tanmateix entities</h1>
  <p>Click any icon to remove it from the set. Click again to restore. When happy, click "Copy final list".</p>

  <div class="controls">
    <button onclick="selectAll()">Restore all</button>
    <button class="primary" onclick="copyList()">Copy final list</button>
    <span class="count" id="count"></span>
  </div>

  <div id="output"></div>

  <div class="grid" id="grid"></div>

  <script>
    const candidates = [
      // Nature & sky
      "acorn", "butterfly", "cactus", "campfire", "cloud", "feather",
      "fire", "flower-tulip", "leaf", "lightning", "meteor", "moon",
      "mountains", "rainbow", "snowflake", "star", "sun", "tree-evergreen",
      "wind",
      // Animals
      "bird", "cat", "dog", "fish", "horse", "paw-print", "rabbit", "shrimp",
      // Food & drink
      "avocado", "bread", "cake", "carrot", "cheese", "cherries",
      "coffee", "cooking-pot", "egg-crack", "ice-cream", "orange", "pizza",
      // Tools & objects
      "anchor", "axe", "barbell", "bell", "binoculars", "bomb",
      "book-open", "boot", "brain", "camera", "crown",
      "flashlight", "gear-six",
      "hammer", "hourglass-simple", "jar", "key", "knife",
      "lamp", "lighthouse", "lock-simple", "magnet", "medal",
      "microscope", "paint-brush", "piano-keys",
      "piggy-bank", "puzzle-piece", "rocket", "sailboat",
      "skull", "sword", "target", "tent",
      "thermometer-simple", "treasure-chest", "trophy",
      "umbrella", "watch", "wrench",
      // Fun & misc
      "alien", "balloon", "bicycle", "bowling-ball", "castle-turret",
      "ghost", "graduation-cap", "guitar", "island", "joystick",
      "planet", "potted-plant", "soccer-ball", "sunglasses",
      "windmill", "yin-yang",
    ];

    const removed = new Set();

    function render() {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      candidates.forEach(name => {
        const card = document.createElement("div");
        card.className = "icon-card" + (removed.has(name) ? " removed" : "");
        card.innerHTML = `<i class="ph-light ph-${name}"></i><span class="name">${name}</span>`;
        card.onclick = () => toggle(name);
        grid.appendChild(card);
      });
      updateCount();
    }

    function toggle(name) {
      if (removed.has(name)) removed.delete(name);
      else removed.add(name);
      render();
    }

    function selectAll() {
      removed.clear();
      render();
    }

    function updateCount() {
      const kept = candidates.length - removed.size;
      document.getElementById("count").textContent = `${kept} / ${candidates.length} kept`;
    }

    function copyList() {
      const kept = candidates.filter(n => !removed.has(n));
      const output = `const ICON_ENTITIES = [\n${kept.map(n => `  "${n}",`).join("\n")}\n];`;
      document.getElementById("output").style.display = "block";
      document.getElementById("output").textContent = output;
      navigator.clipboard?.writeText(output);
    }

    render();
  </script>
</body>
</html>
