<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>bt - topos</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
      :root {
        --bg: #000000;
        --text: #93a1a1;
        --text-bright: #eee8d5;
        --surface: #073642;
        --border: #586e75;
        --font: "Inter", system-ui, -apple-system, sans-serif;
        --node-size: 50px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      header {
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--bg);
        z-index: 10;
      }

      h1 {
        font-size: 1.2rem;
        color: var(--text-bright);
        font-weight: 600;
      }
      .network-name {
        font-family: monospace;
        color: #b58900;
      }

      #timer-container {
        width: 100%;
        height: 4px;
        background: var(--surface);
        z-index: 10;
      }

      #progress-bar {
        height: 100%;
        background: #268bd2;
        width: 100%;
        transform-origin: left;
      }

      #game-area {
        flex-grow: 1;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 1rem;
        overflow: hidden;
      }

      #edge-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
        overflow: visible;
      }

      #node-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
      }

      #distractor-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 5;
        pointer-events: none;
        overflow: hidden;
      }

      .ball {
        position: absolute;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        opacity: 0.6;
      }

      .node {
        position: absolute;
        width: var(--node-size);
        height: var(--node-size);
        border-radius: 12px;
        background: var(--bg);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 32px;
        transform: translate(-50%, -50%);
        border: 2px solid;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
      }

      .ui-panel {
        text-align: center;
        max-width: 400px;
        width: 100%;
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        background: var(--bg);
        padding: 1rem;
      }

      .hidden {
        display: none !important;
      }

      .question-text {
        font-size: 1.25rem;
        color: var(--text-bright);
        line-height: 1.5;
        margin-bottom: 1rem;
      }

      .q-node {
        font-weight: 600;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .btn-group {
        display: flex;
        gap: 1rem;
        width: 100%;
      }

      button {
        flex: 1;
        padding: 1rem;
        font-size: 1.1rem;
        font-weight: bold;
        border: 2px solid var(--border);
        background: var(--bg);
        color: var(--text-bright);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.1s ease;
      }

      button:active {
        background: var(--surface);
        border-color: var(--text-bright);
      }
      button.primary {
        background: var(--surface);
        border-color: #268bd2;
      }

      /* New styles for recap panel */
      #results-panel {
        background: rgba(0, 0, 0, 0.85);
        max-width: 500px;
      }

      #recap-list {
        text-align: left;
        font-size: 0.95rem;
        max-height: 250px;
        overflow-y: auto;
        margin-bottom: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .recap-item {
        padding: 0.75rem;
        border-radius: 6px;
        line-height: 1.4;
        color: var(--text-bright);
      }

      .recap-correct {
        border-left: 4px solid #859900;
        background: rgba(133, 153, 0, 0.15);
      }

      .recap-incorrect {
        border-left: 4px solid #dc322f;
        background: rgba(220, 50, 47, 0.15);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>bt <span style="color: var(--border)">/</span> topos</h1>
      <div id="status-text">Ready</div>
    </header>

    <div id="timer-container" class="hidden">
      <div id="progress-bar"></div>
    </div>

    <div id="game-area">
      <svg id="edge-layer" class="hidden">
        <defs>
          <marker
            id="arrowhead"
            markerWidth="10"
            markerHeight="8"
            refX="10"
            refY="4"
            orient="auto"
          >
            <path d="M0,0 L10,4 L0,8 Z" fill="#586e75" />
          </marker>
        </defs>
        <g id="edges-container"></g>
      </svg>

      <div id="node-layer" class="hidden"></div>
      <div id="distractor-layer" class="hidden"></div>

      <div id="intro-panel" class="ui-panel">
        <p>Memorize the topology. Nodes flow top-to-bottom.</p>
        <button class="primary" onclick="startGame()">Start Sequence</button>
      </div>

      <div id="question-panel" class="ui-panel hidden">
        <div id="q-network" class="network-name">Network Alpha</div>
        <div id="q-text" class="question-text">
          Can the Red Database reach the Blue Robot?
        </div>
        <div class="btn-group">
          <button onclick="answer(true)">True</button>
          <button onclick="answer(false)">False</button>
        </div>
      </div>

      <div id="results-panel" class="ui-panel hidden">
        <h2 style="color: var(--text-bright)">Sequence Complete</h2>
        <p id="score-text" style="font-size: 1.5rem"></p>
        <div id="recap-list"></div>
        <button class="primary" onclick="resetGame()">Play Again</button>
      </div>
    </div>

    <script>
      const INGEST_TIME_MS = 30000;
      const DISTRACTOR_TIME_MS = 15000;
      const NETWORKS = ["Alpha"];
      const ICONS = ["database", "robot", "cloud", "cpu", "bug", "lightning"];
      const COLORS = [
        { name: "Red", hex: "#dc322f" },
        { name: "Blue", hex: "#268bd2" },
        { name: "Green", hex: "#859900" },
        { name: "Yellow", hex: "#b58900" },
      ];

      let questions = [];
      let currentQuestionIndex = 0;
      let score = 0;
      let graphs = {};

      let graphTimerId;
      let distractorTimerId;
      let animationId;

      const edgeLayer = document.getElementById("edge-layer");
      const edgesContainer = document.getElementById("edges-container");
      const nodeLayer = document.getElementById("node-layer");
      const distractorLayer = document.getElementById("distractor-layer");
      const timerContainer = document.getElementById("timer-container");
      const progressBar = document.getElementById("progress-bar");

      function generateGraph(name) {
        const numNodes = 6;
        const layers = 4;
        let nodes = [];
        let edges = [];

        let availableCombos = [];
        COLORS.forEach((c) =>
          ICONS.forEach((i) => availableCombos.push({ color: c, icon: i })),
        );
        availableCombos = availableCombos
          .sort(() => 0.5 - Math.random())
          .slice(0, numNodes);

        let layerMap = [[], [], [], []];
        let unassigned = [...availableCombos];

        for (let i = 0; i < layers; i++) {
          if (unassigned.length > 0) layerMap[i].push(unassigned.pop());
        }
        while (unassigned.length > 0) {
          let l = Math.floor(Math.random() * (layers - 1));
          if (layerMap[l].length < 2) layerMap[l].push(unassigned.pop());
        }

        let idCounter = 0;
        layerMap.forEach((layerNodes, lIdx) => {
          layerNodes.forEach((n) => {
            nodes.push({ id: idCounter++, ...n, layer: lIdx, out: [] });
          });
        });

        nodes.forEach((u) => {
          let potentialTargets = nodes.filter((v) => v.layer > u.layer);
          potentialTargets.forEach((v) => {
            let prob = v.layer - u.layer === 1 ? 0.6 : 0.2;
            if (Math.random() < prob) {
              edges.push({ from: u.id, to: v.id });
              u.out.push(v.id);
            }
          });
        });

        nodes.forEach((u) => {
          if (u.out.length === 0 && u.layer < layers - 1) {
            let targets = nodes.filter((v) => v.layer > u.layer);
            if (targets.length > 0) {
              let t = targets[Math.floor(Math.random() * targets.length)];
              edges.push({ from: u.id, to: t.id });
              u.out.push(t.id);
            }
          }
        });

        return { name, nodes, edges, layers: layerMap };
      }

      function canReach(graph, startId, targetId) {
        let visited = new Set();
        let queue = [startId];
        while (queue.length > 0) {
          let current = queue.shift();
          if (current === targetId) return true;
          if (!visited.has(current)) {
            visited.add(current);
            let node = graph.nodes.find((n) => n.id === current);
            node.out.forEach((neighbor) => queue.push(neighbor));
          }
        }
        return false;
      }

      function cap(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      function formatNodeHtml(n) {
        return `<span class="q-node" style="color: ${n.color.hex};"><i class="ph ph-${n.icon}"></i> ${cap(n.icon)}</span>`;
      }

      function generateQuestionsForGraph(graph) {
        let pool = [];

        for (let i = 0; i < graph.nodes.length; i++) {
          for (let j = 0; j < graph.nodes.length; j++) {
            if (i !== j && graph.nodes[i].layer < graph.nodes[j].layer) {
              let n1 = graph.nodes[i];
              let n2 = graph.nodes[j];
              pool.push({
                network: graph.name,
                text: `Could the ${formatNodeHtml(n1)} reach the ${formatNodeHtml(n2)}?`,
                answer: canReach(graph, n1.id, n2.id),
              });
            }
          }
        }

        graph.nodes.forEach((n) => {
          pool.push({
            network: graph.name,
            text: `Was the ${formatNodeHtml(n)} a pure sink (no outgoing paths)?`,
            answer: n.out.length === 0,
          });
        });

        let uniqueIcons = [...new Set(graph.nodes.map((n) => n.icon))];
        uniqueIcons.forEach((icon) => {
          let nodesOfIcon = graph.nodes.filter((n) => n.icon === icon);
          if (nodesOfIcon.length > 1) {
            let allSinks = nodesOfIcon.every((n) => n.out.length === 0);
            pool.push({
              network: graph.name,
              text: `Were ALL <span class="q-node"><i class="ph ph-${icon}"></i> ${cap(icon)}</span> nodes acting as sinks?`,
              answer: allSinks,
            });
          }
        });

        pool = pool.sort(() => 0.5 - Math.random());
        return pool.slice(0, 5);
      }

      function drawGraph(graph) {
        edgesContainer.innerHTML = "";
        nodeLayer.innerHTML = "";

        const bounds = document
          .getElementById("game-area")
          .getBoundingClientRect();
        const width = bounds.width;
        const height = bounds.height;

        const maxGraphHeight = Math.min(height * 0.75, 450);
        const startY = (height - maxGraphHeight) / 2;
        const layerSpacing = maxGraphHeight / 3;

        let layersArr = [[], [], [], []];
        graph.nodes.forEach((n) => layersArr[n.layer].push(n));

        layersArr[0].forEach((n, idx) => {
          n.y = startY;
          let gap = 120;
          n.x =
            layersArr[0].length === 1
              ? width / 2
              : width / 2 + (idx === 0 ? -gap / 2 : gap / 2);
        });

        for (let i = 1; i < 4; i++) {
          if (layersArr[i].length === 2) {
            let getBarycenter = (node) => {
              let parents = graph.edges
                .filter((e) => e.to === node.id)
                .map((e) => graph.nodes.find((p) => p.id === e.from));
              if (parents.length === 0) return width / 2;
              return parents.reduce((sum, p) => sum + p.x, 0) / parents.length;
            };

            let b0 = getBarycenter(layersArr[i][0]);
            let b1 = getBarycenter(layersArr[i][1]);

            if (b0 > b1) {
              layersArr[i].reverse();
            }
          }

          layersArr[i].forEach((n, idx) => {
            n.y = startY + i * layerSpacing;
            let gap = 120;
            n.x =
              layersArr[i].length === 1
                ? width / 2
                : width / 2 + (idx === 0 ? -gap / 2 : gap / 2);
          });
        }

        graph.nodes.forEach((n) => {
          let el = document.createElement("div");
          el.className = "node";
          el.style.left = `${n.x}px`;
          el.style.top = `${n.y}px`;
          el.style.borderColor = n.color.hex;
          el.style.color = n.color.hex;
          el.innerHTML = `<i class="ph ph-${n.icon}"></i>`;
          nodeLayer.appendChild(el);
        });

        graph.edges.forEach((e) => {
          let u = graph.nodes.find((n) => n.id === e.from);
          let v = graph.nodes.find((n) => n.id === e.to);

          let startX = u.x;
          let startY = u.y + 26;
          let endX = v.x;
          let endY = v.y - 34;

          let path = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path",
          );
          let d = `M ${startX} ${startY} C ${startX} ${(startY + endY) / 2}, ${endX} ${(startY + endY) / 2}, ${endX} ${endY}`;

          path.setAttribute("d", d);
          path.setAttribute("fill", "none");
          path.setAttribute("stroke", "#586e75");
          path.setAttribute("stroke-width", "3");
          path.setAttribute("marker-end", "url(#arrowhead)");
          edgesContainer.appendChild(path);
        });
      }

      function startGame() {
        document.getElementById("intro-panel").classList.add("hidden");
        edgeLayer.classList.remove("hidden");
        nodeLayer.classList.remove("hidden");
        timerContainer.classList.remove("hidden");

        let name = NETWORKS[0];
        graphs[name] = generateGraph(name);
        questions = generateQuestionsForGraph(graphs[name]);

        showNextGraph();
      }

      function resetGame() {
        document.getElementById("results-panel").classList.add("hidden");
        clearTimeout(graphTimerId);
        clearTimeout(distractorTimerId);
        cancelAnimationFrame(animationId);

        questions = [];
        graphs = {};
        score = 0;
        currentQuestionIndex = 0;

        startGame();
      }

      function showNextGraph() {
        let name = NETWORKS[0];
        document.getElementById("status-text").innerText =
          `Ingesting: Network ${name}`;
        document.getElementById("status-text").style.color =
          "var(--text-bright)";

        drawGraph(graphs[name]);

        progressBar.style.transition = "none";
        progressBar.style.width = "100%";

        void progressBar.offsetWidth;

        progressBar.style.transition = `width ${INGEST_TIME_MS}ms linear`;
        progressBar.style.width = "0%";

        graphTimerId = setTimeout(() => {
          startDistractor();
        }, INGEST_TIME_MS);
      }

      function startDistractor() {
        edgeLayer.classList.add("hidden");
        nodeLayer.classList.add("hidden");
        distractorLayer.classList.remove("hidden");
        document.getElementById("status-text").innerText = "Flush Phase";
        document.getElementById("status-text").style.color = "var(--text)";

        progressBar.style.transition = "none";
        progressBar.style.width = "100%";
        void progressBar.offsetWidth;
        progressBar.style.transition = `width ${DISTRACTOR_TIME_MS}ms linear`;
        progressBar.style.width = "0%";

        distractorLayer.innerHTML = "";
        const bounds = document
          .getElementById("game-area")
          .getBoundingClientRect();
        let balls = [];

        for (let i = 0; i < 8; i++) {
          let el = document.createElement("div");
          el.className = "ball";
          el.style.backgroundColor = COLORS[i % COLORS.length].hex;

          let size = 20;
          let x = Math.random() * (bounds.width - size);
          let y = Math.random() * (bounds.height - size);

          el.style.left = `${x}px`;
          el.style.top = `${y}px`;
          distractorLayer.appendChild(el);

          balls.push({
            el: el,
            size: size,
            x: x,
            y: y,
            dx: (Math.random() < 0.5 ? 1 : -1) * (1 + Math.random() * 2),
            dy: (Math.random() < 0.5 ? 1 : -1) * (1 + Math.random() * 2),
          });
        }

        function animate() {
          let w = bounds.width;
          let h = bounds.height;

          balls.forEach((b) => {
            b.x += b.dx;
            b.y += b.dy;

            if (b.x <= 0 || b.x >= w - b.size) b.dx *= -1;
            if (b.y <= 0 || b.y >= h - b.size) b.dy *= -1;

            b.el.style.left = `${b.x}px`;
            b.el.style.top = `${b.y}px`;
          });

          animationId = requestAnimationFrame(animate);
        }
        animate();

        distractorTimerId = setTimeout(() => {
          cancelAnimationFrame(animationId);
          distractorLayer.classList.add("hidden");
          startInterrogation();
        }, DISTRACTOR_TIME_MS);
      }

      function startInterrogation() {
        timerContainer.classList.add("hidden");
        document.getElementById("status-text").innerText = "Interrogation";
        document.getElementById("status-text").style.color = "#dc322f";
        document.getElementById("question-panel").classList.remove("hidden");

        currentQuestionIndex = 0;
        score = 0;
        showNextQuestion();
      }

      function showNextQuestion() {
        if (currentQuestionIndex >= questions.length) {
          showResults();
          return;
        }
        let q = questions[currentQuestionIndex];
        document.getElementById("q-network").innerText = `Network ${q.network}`;
        document.getElementById("q-text").innerHTML = q.text;
      }

      function answer(userAns) {
        let correctAns = questions[currentQuestionIndex].answer;

        let isCorrect = userAns === correctAns;
        questions[currentQuestionIndex].userCorrect = isCorrect;

        if (isCorrect) score++;

        currentQuestionIndex++;
        showNextQuestion();
      }

      function showResults() {
        document.getElementById("question-panel").classList.add("hidden");
        document.getElementById("results-panel").classList.remove("hidden");
        document.getElementById("status-text").innerText = "Complete";
        document.getElementById("status-text").style.color = "var(--text)";

        edgeLayer.classList.remove("hidden");
        nodeLayer.classList.remove("hidden");

        let acc = Math.round((score / questions.length) * 100);
        document.getElementById("score-text").innerText =
          `${score} / ${questions.length} (${acc}%)`;

        let recapHTML = "";
        questions.forEach((q) => {
          let cssClass = q.userCorrect ? "recap-correct" : "recap-incorrect";
          let icon = q.userCorrect
            ? '<i class="ph ph-check-circle" style="color:#859900"></i>'
            : '<i class="ph ph-x-circle" style="color:#dc322f"></i>';

          recapHTML += `
                    <div class="recap-item ${cssClass}">
                        <div style="margin-bottom: 4px;">${icon} ${q.text}</div>
                        <small style="color: var(--border);">Answer was: <strong>${q.answer}</strong></small>
                    </div>
                `;
        });

        document.getElementById("recap-list").innerHTML = recapHTML;
      }
    </script>
  </body>
</html>
